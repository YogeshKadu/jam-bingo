<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style> -->
</head>
<body>
    <section id="main-menu" class="bg-neutral-800 relative">
        <div class="h-svh flex justify-center items-center">
            <div>
                <h1 class="text-white text-7xl font-black"><span class="text-neutral-700 duration-1000 text-8xl">#</span>SpinGo</h1>
                <p class="text-gray-200 text-xl text-center mt-32 uppercase">Select your game</p>
                <div class="mx-auto mt-5 flex gap-3 text-white justify-center">
                    <button id="easy-game" class="flex-1 flex gap-2 items-center p-3 rounded-md cursor-pointer active:[&_span]:scale-95 hover:bg-neutral-700">
                        <span class="block w-6 h-6 rounded-full border-white bg-white"></span>
                        <p class="uppercase">Easy</p>
                    </button>
                    <button id="complex-game" class="flex-1 flex gap-2 items-center p-3 rounded-md cursor-pointer active:[&_span]:scale-95 hover:bg-neutral-700">
                        <span class="block w-6 h-6 rounded-full border-2 border-white"></span>
                        <p class="uppercase">Complex</p>
                    </button>
                </div>
                <div class="w-full max-w-md mt-5 flex gap-3">
                    <button id="play-bot" class="bg-neutral-700 text-white flex-1 py-3 rounded-md cursor-pointer transition-transform active:scale-95 ease-in-out font-semibold font-mono relative">
                        BOT
                    </button>
                    <button id="play-enemy" class="bg-neutral-700 text-white flex-1 py-3 rounded-md cursor-pointer transition-transform active:scale-95 ease-in-out font-semibold font-mono relative">
                        LOCAL 2P
                    </button>
                </div>
            </div>
        </div>
    </section>
    <section id="game-board" class="hidden bg-neutral-800 w-full box-border">
        <div class="flex flex-wrap relative">
            <div id="counter-banner" class="absolute top w-full p-5">
                <h3 class="text-center font-lg text-white uppercase text-xl font-semibold mb-2">The Board will rotate in</h3>
                <div class="w-20 h-20 cursor-pointer text-white relative bg-neutral-700 mx-auto rounded-full grid place-content-center font-black text-4xl">
                    <div class="animate-ping bg-neutral-700 absolute w-full h-full rounded-full mx-auto"></div>
                    <span id="counter" class="-translate-y-1 z-10">
                        2
                    </span>
                </div>
            </div>
            <div class="absolute h-20 w-full">
                <div class="h-full flex gap-5 items-center px-5 mx-auto max-w-4xl">
                    <button id="home" class="w-12 h-12 grid place-content-center rounded-full bg-neutral-700 text-white cursor-pointer transition-transform active:scale-95 ease-in-out mr-auto relative hover:[&_span]:opacity-100 hover:[&_span]:translate-y-10 focus:[&_span]:opacity-100 focus:[&_span]:translate-y-10">
                        <span class="absolute transition-all opacity-0 -translate-x-3 translate-y-2 bg-black text-white px-3 py-1.5 rounded-sm pointer-events-none">Home</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor" d="m21.743 12.331l-9-10c-.379-.422-1.107-.422-1.486 0l-9 10a1 1 0 0 0-.17 1.076c.16.361.518.593.913.593h2v7a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4h4v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-7h2a.998.998 0 0 0 .743-1.669" />
                        </svg>
                    </button>
                    <!--  -->
                    <button id="help" class="w-12 h-12 grid place-content-center rounded-full bg-neutral-700 text-white cursor-pointer transition-transform active:scale-95 ease-in-out  relative hover:[&_span]:opacity-100 hover:[&_span]:translate-y-10 focus:[&_span]:opacity-100 focus:[&_span]:translate-y-10">
                        <span class="absolute transition-all opacity-0 -translate-x-1 translate-y-2 bg-black text-white px-3 py-1.5 rounded-sm pointer-events-none">Help</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.195 8.765A4 4 0 1 1 12 14v1m.05 4v.1h-.1V19z" />
                        </svg>
                    </button>
                    <button id="mute" class="w-12 h-12 grid place-content-center rounded-full bg-neutral-700 text-white cursor-pointer transition-transform active:scale-95 ease-in-out  relative hover:[&_span]:opacity-100 hover:[&_span]:translate-y-10 focus:[&_span]:opacity-100 focus:[&_span]:translate-y-10">
                        <span class="absolute transition-all opacity-0 -translate-x-3 translate-y-2 bg-black text-white px-3 py-1.5 rounded-sm pointer-events-none">Toggle</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" width="1em" height="1em" viewBox="0 0 16 16">
                            <path d="M0 0h16v16H0z" fill="none" />
                            <path fill="currentColor" d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8L9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0" />
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-5 hidden" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor" d="M13.977 4.201a1 1 0 0 1 1.633.645l.095.766c.53 4.242.53 8.534 0 12.776l-.095.766a1 1 0 0 1-1.633.644l-5.019-4.182a.5.5 0 0 0-.32-.116H4.75c-.69 0-1.25-.56-1.25-1.25v-4.5c0-.69.56-1.25 1.25-1.25h3.888a.5.5 0 0 0 .32-.116zm5.055 3.747a.75.75 0 0 0-1.408.517c.405 1.1.626 2.291.626 3.535a10.3 10.3 0 0 1-.626 3.535a.75.75 0 0 0 1.408.517A11.7 11.7 0 0 0 19.75 12c0-1.423-.253-2.788-.718-4.052" />
                        </svg>
                    </button>
                    <button id="restart" class="w-12 h-12 grid place-content-center rounded-full bg-neutral-700 text-white cursor-pointer transition-transform active:scale-95 ease-in-out  relative hover:[&_span]:opacity-100 hover:[&_span]:translate-y-10 focus:[&_span]:opacity-100 focus:[&_span]:translate-y-10">
                        <span class="absolute transition-all opacity-0 -translate-x-3 translate-y-2 bg-black text-white px-3 py-1.5 rounded-sm pointer-events-none">Restart</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.651 7.65a7.131 7.131 0 0 0-12.68 3.15M18.001 4v4h-4m-7.652 8.35a7.13 7.13 0 0 0 12.68-3.15M6 20v-4h4" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="w-lvw md:w-1/2 bg-neutral-800 md:h-svh p-8 pt-36">
                <div class="w-full max-w-sm mx-auto md:mx-0 md:ml-auto">
                    <div class="header">
                        <h1 id="player-title" class="text-4xl font-black text-neutral-500/40 flex justify-around flex-nowrap [&_span]:aspect-square [&_span]:block [&_span]:text-center [&_span]:w-9">
                            <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
                        </h1>
                        <div id="player-score" class="mt-4 w-full bg-neutral-500/40 h-1.5">
                            <span class="transition-all duration-300 block h-full bg-white w-[20%]"></span>
                        </div>
                    </div>
                    <div id="player-board" class="board w-full grid grid-cols-5 mt-5 gap-2">
                        <button class="rounded-md #bg-cyan-400 bg-neutral-700 aspect-square"></button>
                        <button class="rounded-md #bg-cyan-400 bg-cyan-400 aspect-square border-b-4 border-cyan-800"></button>
                    </div>
                    <div class="text-center mt-8">
                        <h2 class="font-black text-2xl text-white">PLAYER</h2>
                    </div>
                </div>
            </div>
            <div class="w-lvw md:w-1/2 bg-neutral-900 md:h-svh p-8 pt-36">
                <div class="w-full max-w-sm mx-auto md:mx-0 md:mr-auto">
                    <div class="header">
                        <h1 id="enemy-title" class="text-4xl font-black text-neutral-500/40 flex justify-around flex-nowrap [&_span]:aspect-square [&_span]:block [&_span]:text-center [&_span]:w-9">
                            <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
                        </h1>
                        <div id="enemy-score" class="mt-4 w-full bg-neutral-500/40 h-1.5">
                            <span class="transition-all duration-300 block h-full w-[20%] bg-white"></span>
                        </div>
                    </div>
                    <div id="enemy-board" class="board w-full grid grid-cols-5 mt-5 gap-2">
                        <button class="rounded-md #bg-cyan-400 bg-neutral-700 aspect-square"></button>
                        <button class="rounded-md #bg-cyan-400 bg-pink-400 aspect-square border-b-4 border-pink-800"></button>
                    </div>
                    <div class="text-center mt-8">
                        <h2 id="playerName" class="font-black text-2xl text-white uppercase">BOT</h2>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <dialog id="help-dialog" data-modal class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 p-5 bg-neutral-900 rounded-lg border border-gray-500">
        <div class="text-white px-5">
            <div class="flex flex-col">
                <p>1. Play as regular bingo game, for more info <a class="text-blue-400" target="_blank" href="https://www.wikihow.com/Play-Bingo">click here</a>.</p>
                <p>2. If playing in complex mode 😈</p>
                <p class="pl-5">- Both board will rotate 1 tile clockwise <b>after every 6 moves !</b></p>
                <img src="./assets/help/guide1.png" alt="guide image" class="max-w-md pl-5 mt-3">
            </div>
            <button data-close-modal id="data-close-modal" class="text-white bg-neutral-700 px-3 py-2 mt-5 rounded-md cursor-pointer">Close</button>
        </div>
    </dialog>
    <dialog id="game-over" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-neutral-700 text-white w-full max-w-xs rounded-lg border-2 border-gray-400">
        <div class="p-5 relative">
            <button id="over-cancel" class="w-6 h-6 hover:bg-neutral-600 rounded grid place-content-center absolute right-1.5 top-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32">
                    <path d="M0 0h32v32H0z" fill="none" />
                    <path fill="currentColor" d="M17.414 16L26 7.414L24.586 6L16 14.586L7.414 6L6 7.414L14.586 16L6 24.586L7.414 26L16 17.414L24.586 26L26 24.586z" />
                </svg>
            </button>
            <h3 class="text-center text-xl">✨Game Over✨</h3>
            <h1 class="font-black text-2xl text-center">PLAYER 1 WINS!</h1>
            <div class="flex mt-5 gap-5">
                <button id="over-home" class="flex-1 px-4 py-1.5 bg-neutral-600 rounded-md cursor-pointer active:bg-neutral-500">Home</button>
                <button id="over-retry" class="flex-1 px-4 py-1.5 bg-neutral-600 rounded-md cursor-pointer active:bg-neutral-500">Play Again</button>
            </div>
        </div>
    </dialog>
    <script type="module" src="./libs/initialize.js"></script>
    <script type="module" src="./script.js"></script>
</body>
</html>
